# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release Host

on:
  workflow_dispatch: {}
  push:
    tags:
      - "host-v*"

permissions:
  contents: write

jobs:
  # Read hotkeypad_host's own version once so every job/asset name agrees,
  # instead of each platform job parsing pubspec.yaml itself.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version=$(grep '^version:' hotkeypad_host/pubspec.yaml | sed -E 's/^version: *//' | cut -d+ -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: hotkeypad_host
        run: flutter pub get

      # The Xcode project's Release config always signs with the
      # "Developer ID Application" identity (see SKILL.md's "Code
      # signing" section) — the build fails outright without a matching
      # certificate/key in the keychain, so import one into a throwaway
      # keychain before building. This is a certificate issued separately
      # for CI, not a developer's local one, so a leaked secret here only
      # means revoking this one cert.
      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CI_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=ci-signing.keychain-db
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_CI_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          rm -f certificate.p12

      - name: Write App Store Connect API key
        env:
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
        run: |
          mkdir -p private_keys
          echo "$NOTARY_API_KEY_P8" | base64 --decode > private_keys/AuthKey.p8
          echo "NOTARY_API_KEY_PATH=$PWD/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # Builds, packages, notarizes and staples in one step; see
      # .claude/skills/release-macos/SKILL.md for what the script does.
      - name: Build, sign & notarize .dmg
        env:
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: .claude/skills/release-macos/scripts/package_macos_dmg.sh

      - name: Clean up signing keychain and API key
        if: always()
        run: |
          security delete-keychain ci-signing.keychain-db || true
          rm -f private_keys/AuthKey.p8 || true

      - uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: hotkeypad_host/dist/*.dmg
          if-no-files-found: error

  build-windows:
    needs: version
    # Not windows-latest: its current MSVC toolset (14.51, "VS 18") turns
    # bluetooth_low_energy_windows's use of the deprecated /await flag +
    # <experimental/coroutine> into a hard compile error (STL1011) instead
    # of a warning. windows-2022's older toolset still accepts it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: hotkeypad_host
        run: flutter pub get

      - name: Build Windows release
        working-directory: hotkeypad_host
        run: flutter build windows --release

      - name: Zip the release folder
        working-directory: hotkeypad_host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ needs.version.outputs.version }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/HotkeyPad-Host-$version-windows.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: windows-zip
          path: hotkeypad_host/dist/*.zip
          if-no-files-found: error

  release:
    needs: [version, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Same tag on every run of the same version updates that one
      # pre-release in place instead of piling up duplicates.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: host-v${{ needs.version.outputs.version }}
          name: HotkeyPad Host v${{ needs.version.outputs.version }}
          prerelease: true
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-zip/*.zip
