# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # This is a monorepo with no pubspec.yaml at the repo root — each of
    # these is its own Flutter package, analyzed/tested independently.
    strategy:
      # A failure in one package (e.g. hotkeypad_host) shouldn't cancel the
      # others mid-run — each package's result should be judged on its own.
      fail-fast: false
      matrix:
        package:
          - packages/hotkeypad_protocol
          - hotkeypad_host
          - hotkeypad_client

    steps:
      - uses: actions/checkout@v5

      # All three packages depend on the Flutter SDK (not just Dart's),
      # so this needs Flutter installed rather than dart-lang/setup-dart.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        working-directory: ${{ matrix.package }}
        run: flutter analyze

      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: flutter test
